name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -notmatch 'project\(DKColorPicker VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not resolve project version from CMakeLists.txt"
          }
          "tag=v$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -ExePath build/Release/DKColorPicker.exe

      - name: Create release when version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; skipping."
            exit 0
          }

          gh release create "$env:RELEASE_TAG" `
            "dist/DKColorPicker-win-x64.zip" `
            --target "${{ github.sha }}" `
            --title "DK Color Picker $env:RELEASE_TAG" `
            --generate-notes
